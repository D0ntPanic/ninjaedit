[package]
name = "ninjaedit"
version = "0.1.0"
edition = "2024"

[dependencies]
ninjaedit-core = { path = "../core" }
# Text only: the default `image-data` feature pulls in image decoding we
# have no use for.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
toml = "1.1.5"

[dev-dependencies]
tempfile = "3"
