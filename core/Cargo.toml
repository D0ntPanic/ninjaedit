[package]
name = "ninjaedit-core"
version = "0.1.0"
edition = "2024"

[dependencies]
code-fuzzy-match = "0.2.2"
git2 = { version = "0.21.0", features = ["ssh", "https", "vendored-libgit2", "vendored-openssl"] }
regex = "1.13.1"
ignore = "0.4"
jiff = "0.2"
notify = "8"
tempfile = "3"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
vte = "0.15"
portable-pty = "0.9"
compact_str = "0.9"
toml = "1.1.5"
twox-hash = { version = "2.1.4", default-features = false, features = ["xxhash64"] }
