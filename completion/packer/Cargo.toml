[package]
name = "packer"
version = "0.1.0"
edition = "2024"
description = "Packs the tokenized corpus into fixed-length training rows with fill-in-the-middle"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
corpus = { path = "../corpus" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizer = { path = "../tokenizer" }
twox-hash = { version = "2.1.4", default-features = false, features = ["xxhash3_64"] }
