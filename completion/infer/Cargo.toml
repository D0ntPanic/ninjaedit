[package]
name = "infer"
version = "0.1.0"
edition = "2024"
description = "Dedicated CPU inference for the completion model"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = "2"
rayon = "1.10"
safetensors = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizer = { path = "../tokenizer" }
